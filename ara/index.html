<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARA · suivi des élèves</title>
<meta name="theme-color" content="#4c34b8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/ara-192.png">
<link rel="apple-touch-icon" href="icones/ara-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARA">
<style>
:root{--bg:#f5f3fb;--surface:#fff;--fg:#1d1830;--muted:#625b78;--line:#ddd8ec;--accent:#4c34b8;--accent-pale:#ebe6fa;
  --prepa:#e08a00;--prepa-pale:#fff1d6;--pert:#d83a3a;--pert-pale:#fde3e3;--cours:#1f7fc4;--cours-pale:#dff0fb;--ok:#1e8a4c;--ok-pale:#ddf3e5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121019;--surface:#1c1927;--fg:#ece9f5;--muted:#a49cba;--line:#302b42;--accent:#9d88ff;--accent-pale:#2a2445;
  --prepa:#f2a93b;--prepa-pale:#3a2c12;--pert:#ff7a7a;--pert-pale:#3e1f22;--cours:#5cb4f0;--cours-pale:#142e40;--ok:#55c487;--ok-pale:#163527;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body,a,button,input,select,textarea{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
main{max-width:760px;margin:0 auto;padding:0 12px}
header.haut{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#4c34b8,#7b3fc0 55%,#d6468c);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 128px 10px 12px;display:flex;align-items:center;gap:10px;min-height:58px}
header.haut img{width:38px;height:38px;border-radius:10px;box-shadow:0 2px 6px #0003}
header.haut h1{font-size:20px;margin:0;line-height:1.15}
header.haut .sub{font-size:13px;opacity:.9}
header.haut button.retour{border:0;background:#ffffff26;color:#fff;font:700 20px/1 system-ui;border-radius:10px;width:40px;height:40px;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:600;background:var(--surface)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.lien{border:0;background:none;color:var(--accent);padding:8px 4px;text-decoration:underline}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{color:var(--muted);font-size:14px}
h2{font-size:17px;margin:22px 0 8px}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}

/* Accueil : les classes */
.classes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.classes a{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 14px;box-shadow:0 4px 14px #4c34b814}
.classes a:active{transform:scale(.97)}
.classes b{display:block;font-size:34px;line-height:1;color:var(--accent);letter-spacing:.5px}
.classes span{display:block;margin-top:8px;font-size:14px;color:var(--muted)}
.classes .anoter{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-pale);color:var(--accent)}
.periode-du-jour{margin:14px 0 0;font-size:14px;color:var(--muted)}
.periode-du-jour b{color:var(--fg)}

/* Classe */
.barre{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 6px}
.jour{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:600;position:relative}
.jour input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.jour.pas-auj{border-color:var(--pert);color:var(--pert)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-pale);color:var(--accent)}
.legende{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 10px;font-size:12px;font-weight:600}
.legende span{padding:4px 7px;border-radius:99px;white-space:nowrap}
.l-prepa{background:var(--prepa-pale);color:var(--prepa)}.l-pert{background:var(--pert-pale);color:var(--pert)}.l-cours{background:var(--cours-pale);color:var(--cours)}
.eleves{display:flex;flex-direction:column;gap:6px}
.eleve{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 4px}
.eleve .nom{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 6px;border-radius:10px}
.eleve .nom b{font-size:16px}
.eleve .nom small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eleve .nom .vu{color:var(--ok);font-weight:600}
.m{position:relative;flex:none;width:52px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.m .n{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;font:800 13px/22px system-ui,sans-serif;color:#fff;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.m.prepa .n{background:var(--prepa)}.m.pert .n{background:var(--pert)}.m.cours .n{background:var(--cours)}
.m.prepa.on{background:var(--prepa);border-color:var(--prepa)}
.m.pert.on{background:var(--pert);border-color:var(--pert)}
.m.cours.on{background:var(--cours);border-color:var(--cours)}
.m:active{transform:scale(.92)}
.m.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.18)}}
.bas{display:flex;flex-direction:column;gap:8px;margin-top:16px}

/* Fiche élève */
.fiche-tete{display:flex;align-items:center;gap:12px;margin-top:14px}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--accent-pale);color:var(--accent);display:flex;align-items:center;justify-content:center;font:800 20px system-ui;flex:none}
.fiche-tete h2{margin:0;font-size:22px}
.compteurs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.compteurs div{border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;font-weight:600}
.compteurs b{display:block;font-size:24px;line-height:1.1}
.c-prepa{background:var(--prepa-pale);color:var(--prepa)}.c-pert{background:var(--pert-pale);color:var(--pert)}.c-cours{background:var(--cours-pale);color:var(--cours)}
.per-tete{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.per-tete b{font-size:18px}
.per-tete span{font-size:13px;color:var(--muted)}
.per.actuelle{border:2px solid var(--accent)}
.ligne{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.ligne:first-of-type{border-top:0}
.ligne .d{color:var(--muted);font-size:13px;width:86px;flex:none}
.ligne .q{flex:1}
.ligne .x{border:0;background:none;color:var(--muted);font-size:17px;padding:4px 8px}
.ligne.notif{background:var(--ok-pale);color:var(--ok);border-radius:10px;padding:8px 10px;margin:4px 0;border-top:0;font-weight:600;flex-wrap:wrap}
.ligne.notif .q small{display:block;font-weight:400;opacity:.9}
.anoter-bloc{background:var(--accent-pale);border-radius:14px;padding:12px;margin:12px 0}
.anoter-bloc .titre{font-weight:700;color:var(--accent)}

/* Fenêtres */
.fond{position:fixed;inset:0;z-index:50;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.fenetre{background:var(--bg);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.fond{align-items:center}.fenetre{border-radius:20px}}
.fenetre h3{margin:0 0 6px;font-size:19px}
.fenetre label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.fenetre input[type=text],.fenetre input[type=date],.fenetre textarea,.fenetre select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:var(--surface);color:var(--fg)}
.choix{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.choix input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.choix .q{flex:1}
.choix small{display:block;color:var(--muted)}
.l{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.champ{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:var(--bg);color:var(--fg)}
.per-edit{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;align-items:center;margin:6px 0}
.per-edit b{font-size:16px}
.bulle{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d1830;color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;z-index:60;box-shadow:0 4px 14px #0004;max-width:92vw;text-align:center}
.vide{text-align:center;color:var(--muted);padding:16px}
</style>
</head>
<body>
<header class="haut">
  <button class="retour" id="retour" type="button" aria-label="Retour" hidden>‹</button>
  <img src="icones/ara-192.png" alt="" id="logo">
  <div><h1 id="titre">ARA</h1><div class="sub" id="sous-titre">Suivi des élèves</div></div>
</header>
<main id="vue"></main>

<script src="../sync.js"></script>
<script src="eleves.js"></script>
<script src="app.js"></script>
</body>
</html>
